<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SPEAK V49.35 - Midnight Bonfire</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        /* 🌌 全新色彩规范：午夜、烛火、星云 */
        :root { 
            --bg-deep: #080911; 
            --bg-mid: #121420; 
            --gold: #e5b567; 
            --gold-glow: rgba(229, 181, 103, 0.4); 
            --purple: #7a4ebf; 
            --purple-glow: rgba(122, 78, 191, 0.4);
            --text-main: #f0f0f0; 
            --text-muted: #888c99; 
            --glass-bg: rgba(18, 20, 32, 0.65); 
            --glass-border: rgba(255, 255, 255, 0.08);
            --danger: #ff4757;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; border: none; -webkit-tap-highlight-color: transparent; }
        
        /* 字体混搭：UI用等宽，阅读用无衬线黑体 */
        body { background: var(--bg-deep); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .mono { font-family: "Courier New", monospace; }
        
        /* 沉浸式星空底图 */
        .plasma-bg { position: fixed; inset: 0; z-index: -1; opacity: 0.9; background: radial-gradient(circle at 50% 50%, #1a1625 0%, #080911 70%); }
        .plasma-bg::after { content: ''; position: absolute; inset: 0; background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)" opacity="0.04"/></svg>'); pointer-events: none; }

        /* 沉浸式开场 */
        #intro-overlay { position: fixed; inset: 0; z-index: 300000; background: #050508; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; transition: opacity 1.5s ease; }
        .intro-text { color: #aaa; font-size: 1.05rem; line-height: 2.4; margin-bottom: 50px; animation: fadeIn 2s ease-in-out; letter-spacing: 1px; }
        .intro-highlight { color: var(--gold); font-weight: 300; font-size: 1.15rem; text-shadow: 0 0 15px var(--gold-glow); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 毛玻璃组件 */
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }

        #login-screen { position: fixed; inset: 0; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(8,9,17,0.9); backdrop-filter: blur(10px); }
        .pixel-input { width: 260px; padding: 16px; background: rgba(0,0,0,0.5); border: 2px solid var(--glass-border); color: var(--gold); text-align: center; font-size: 1.1rem; margin-bottom: 20px; border-radius: 12px; transition: 0.3s; }
        .pixel-input:focus { border-color: var(--gold); box-shadow: 0 0 15px var(--gold-glow); }

        #main-game { display: none; flex-direction: column; height: 100vh; width: 100vw; background: transparent; }
        
        /* 打字机状态栏 */
        #process-guide { height: 36px; background: rgba(229, 181, 103, 0.05); color: var(--gold); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; border-bottom: 1px solid rgba(229, 181, 103, 0.1); letter-spacing: 1px; }
        .cursor { animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        .header-bar { height: 100px; display: flex; justify-content: space-between; padding: 10px 15px; border-bottom: 1px solid var(--glass-border); }
        #player-area { display: flex; gap: 12px; overflow-x: auto; flex: 1; align-items: center; scroll-behavior: smooth; }
        #companion-area { width: 75px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-left: 1px solid var(--glass-border); padding-left: 10px; }
        
        .p-item { display: flex; flex-direction: column; align-items: center; min-width: 55px; opacity: 0.4; transition: 0.5s ease; }
        .p-item.online { opacity: 0.85; }
        .p-avatar { width: 42px; height: 42px; border: 2px solid var(--text-muted); background: #111; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; border-radius: 12px; transition: 0.5s; }
        .is-companion { border-color: var(--purple) !important; color: var(--purple); }
        
        /* 🌟 发言者：金色呼吸光晕 */
        .p-item.active-turn { opacity: 1; transform: translateY(-3px); }
        .p-item.active-turn .p-avatar { border-color: var(--gold); animation: breathe 2.5s infinite alternate ease-in-out; }
        @keyframes breathe { 0% { box-shadow: 0 0 8px var(--gold-glow); } 100% { box-shadow: 0 0 20px var(--gold-glow), inset 0 0 8px var(--gold-glow); } }

        /* 舞台区与聚光灯暗场 */
        .stage { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; perspective: 1200px; z-index: 10; }
        
        /* 聚光灯层：允许点击穿透，不挡操作！ */
        #card-podium { position: absolute; inset: 0; background: rgba(5, 5, 8, 0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; transition: opacity 0.6s; pointer-events: none; z-index: 4000; }
        #card-podium.show { opacity: 1; }

        /* 🃏 3D 翻转出场 */
        @keyframes flipIn { 0% { transform: translate(-50%, -50%) rotateY(90deg) scale(0.9); opacity: 0; } 100% { transform: translate(-50%, -50%) rotateY(0deg) scale(1); opacity: 1; } }
        
        #focus-board { 
            position: absolute; top: 46%; left: 50%; width: 82vw; height: 48vh; max-width: 360px; max-height: 420px;
            border-radius: 20px; padding: 25px 20px; display: none; flex-direction: column; align-items: center; justify-content: space-between;
            z-index: 5001; transform: translate(-50%, -50%); opacity: 0;
            background: linear-gradient(135deg, #e8e8e8, #f5f5f5); color: #1a1a1a; box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.5);
        }
        #focus-board.show { display: flex; animation: flipIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        /* 墨迹显影文字 */
        .ink-text { font-size: 1.1rem; font-weight: 500; text-align: center; line-height: 1.6; color: #222; }
        .ink-reveal { animation: inkFade 2s ease-out forwards; }
        @keyframes inkFade { 0% { filter: blur(8px); opacity: 0; } 100% { filter: blur(0); opacity: 1; } }

        #comp-card-board {
            position: absolute; top: 46%; left: 50%; width: 85vw; max-width: 380px; 
            border: 2px solid var(--purple); border-radius: 16px; padding: 8px; display: none; flex-direction: column; align-items: center;
            z-index: 6001; transform: translate(-50%, -50%); opacity: 0;
        }
        #comp-card-board.show { display: flex; animation: flipIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        #spectrum-img { width: 100%; height: auto; max-height: 42vh; object-fit: contain; border-radius: 10px; display: none; box-shadow: 0 10px 30px var(--purple-glow); } 
        
        .podium-hidden { opacity: 0.08 !important; filter: grayscale(100%); pointer-events: none !important; }

        /* 🔘 物理阻尼按钮 */
        .ctrl-btn { height: 44px; background: rgba(255,255,255,0.05); color: var(--text-main); font-weight: 600; border-radius: 12px; border: 1px solid var(--glass-border); cursor: pointer; transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1); backdrop-filter: blur(4px); }
        .ctrl-btn:active:not(:disabled) { transform: scale(0.92); background: rgba(255,255,255,0.1); }
        .ctrl-btn:disabled { opacity: 0.2; pointer-events: none; }
        
        .btn-gold { color: var(--gold); border-color: rgba(229, 181, 103, 0.3); }
        .btn-purple { color: #b388ff; border-color: rgba(122, 78, 191, 0.4); }

        /* 聊天与控制台区：平滑滚动与安全区 */
        .footer { height: 240px; border-top: 1px solid var(--glass-border); display: flex; flex-direction: column; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        #chat-flow { flex: 1; overflow-y: auto; padding: 12px 15px; font-size: 0.85rem; color: #ccc; scroll-behavior: smooth; line-height: 1.5; }
        
        .btn-panel { height: 85px; display: flex; padding: 5px 15px; gap: 12px; align-items: center; justify-content: center; }
        
        /* 🎙️ 麦克风电波脉冲 */
        .mic-btn { border-radius: 50%; width: 60px; height: 60px; font-size: 1.5rem; color: #fff; background: rgba(255,255,255,0.05); border: 2px solid var(--glass-border); transition: 0.3s; position: relative; display: flex; align-items: center; justify-content: center; }
        .mic-btn:active { transform: scale(0.9); }
        .mic-btn.active { background: var(--gold); border-color: var(--gold); color: #000; box-shadow: 0 0 20px var(--gold-glow); animation: mic-pulse 2s infinite; }
        @keyframes mic-pulse { 0% { box-shadow: 0 0 0 0 rgba(229, 181, 103, 0.6); } 70% { box-shadow: 0 0 0 15px rgba(229, 181, 103, 0); } 100% { box-shadow: 0 0 0 0 rgba(229, 181, 103, 0); } }
        
        /* ✨ 星火升腾动效 */
        .spark { position: fixed; pointer-events: none; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); animation: floatUp 1.5s ease-in forwards; z-index: 300000; }
        @keyframes floatUp { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }

        #deck { position: relative; z-index: 4500; }
        #host-start-btn { position: fixed; bottom: 140px; left: 50%; transform: translateX(-50%); z-index: 150000; display: none; background: var(--gold); color: #000; padding: 16px 45px; border-radius: 50px; font-weight: 600; font-size: 1.1rem; border: none; box-shadow: 0 10px 30px var(--gold-glow); letter-spacing: 1px; }
        
        .overlay { position: fixed; inset: 0; z-index: 200000; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(8,9,17,0.85); backdrop-filter: blur(12px); }
        #img-loader { width: 36px; height: 36px; border: 3px solid rgba(122, 78, 191, 0.2); border-top-color: var(--purple); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<audio id="bgm-audio" src="" loop preload="auto"></audio>
<audio id="sfx-flip" src="" preload="auto"></audio>
<audio id="sfx-magic" src="" preload="auto"></audio>
<audio id="sfx-click" src="" preload="auto"></audio>

<div class="plasma-bg"></div>

<div id="intro-overlay">
    <div class="intro-text">
        <p>欢迎来到 <span class="intro-highlight mono">SPEAK</span>。</p>
        <p>在这个空间里，请卸下伪装与防备。</p>
        <p><span class="intro-highlight">陪伴彼此，一起成长。</span></p><br>
        <p>这一刻，你是故事的叙述者；<br>下一刻，你就是他人的陪伴师。</p>
        <p>请打开心扉，认真聆听。</p>
    </div>
    <button class="ctrl-btn mono" style="width: 240px; height: 55px; border-color: var(--text-muted); font-size: 1rem;" onclick="dismissIntro()">[ 开启灵魂共振 ]</button>
</div>

<div id="login-screen">
    <div class="mono" style="font-size: 4rem; font-weight: 900; color: #fff; text-shadow: 0 0 30px var(--gold-glow); margin-bottom: 40px; letter-spacing: 2px;">SPEAK</div>
    <input type="text" id="nick-in" class="pixel-input mono" placeholder="YOUR NAME">
    <input type="text" id="room-in" class="pixel-input mono" placeholder="ROOM CODE">
    <button class="ctrl-btn mono" style="width:260px; height:55px; background:var(--gold); color:#000; border:none; margin-top:10px;" onclick="entry('join')">ENTER</button>
    <button class="mono" onclick="tryCompanion()" style="margin-top:25px; color:var(--purple); font-size:0.75rem; background:none; letter-spacing: 1px;">- 陪伴师通道 -</button>
</div>

<div id="main-game">
    <div class="header-bar glass-panel">
        <div id="player-area"></div>
        <div id="companion-area"></div>
    </div>
    
    <div id="process-guide" class="mono"><span id="guide-text">寻找信号源中...</span></div>
    
    <div class="stage">
        <div id="card-podium"></div>
        
        <div id="focus-board">
            <div class="mono" style="font-size:0.6rem; color:#888; letter-spacing: 2px;">[ SENSITIVE FILE ]</div>
            <div id="q-text" class="ink-text">档案读取中...</div>
            <button id="btn-close" class="ctrl-btn btn-gold" style="width:140px; border-width:2px; background:#fff; color:#000;" onclick="userCmd('CLOSE')">完成回答</button>
        </div>
        
        <div id="comp-card-board" class="glass-panel">
            <div id="img-loader"></div>
            <img id="spectrum-img" src="" alt="Tarot">
            <button id="btn-cc-close" class="ctrl-btn btn-purple mono" style="width:160px; margin-top:12px; display:none;" onclick="hostCmd('CLOSE_COMP')">收回指引</button>
        </div>
        
        <div id="deck" style="display:none; gap:12px; overflow-x:auto; padding:20px; width:100%;"></div>
    </div>

    <div class="footer glass-panel">
        <div style="display:flex; justify-content:space-between; padding:8px 15px; border-bottom:1px solid var(--glass-border);">
            <div class="mono" style="color:var(--text-muted); font-size:0.7rem; display:flex; align-items:center;">ROOM: <span id="room-id-val" style="color:var(--gold); margin-left:5px;">---</span></div>
            <div style="display:flex; gap:8px;">
                <button id="btn-eye" class="ctrl-btn btn-gold mono" style="display:none; height:26px; font-size:0.65rem; padding:0 8px; border-radius:6px;" onclick="hostCmd('TOGGLE_EYE')">👁️ 藏牌</button>
                <button id="btn-shuffle" class="ctrl-btn btn-purple mono" style="display:none; height:26px; font-size:0.65rem; padding:0 8px; border-radius:6px;" onclick="hostCmd('SHUFFLE_COMP')">🔄 洗牌</button>
            </div>
        </div>
        
        <div id="chat-flow"></div>
        
        <div style="display:flex; padding:0 15px; gap:10px;">
            <input type="text" id="chat-input" style="flex:1; padding:10px 15px; background:rgba(0,0,0,0.5); border:1px solid var(--glass-border); border-radius:20px; color:#fff; font-size:0.85rem;" placeholder="传递共鸣...">
            <button class="ctrl-btn mono" style="width:60px; height:40px; border-radius:20px;" onclick="sendTextChat()">SEND</button>
        </div>
        
        <div class="btn-panel">
            <button id="btn-like" class="ctrl-btn" style="width:60px;" disabled onclick="actionReact('✨')">✨</button>
            <button id="btn-dis" class="ctrl-btn" style="width:60px;" disabled onclick="actionReact('🤍')">🤍</button>
            <button id="mic-btn" class="mic-btn" onclick="toggleMic()">🎙️</button>
            <button id="btn-trans" class="ctrl-btn" style="width:60px; color:var(--danger);" disabled onclick="userCmd('CLOSE')">🔄</button>
        </div>
    </div>
</div>

<div id="pwd-overlay" class="overlay">
    <div class="glass-panel" style="padding:30px; border-radius:20px; width:80%; max-width:320px; text-align:center;">
        <h3 style="margin-bottom:20px; color:var(--text-main); font-weight:400;">导师认证</h3>
        <input type="password" id="comp-pwd-in" class="mono" style="width:100%; padding:12px; background:rgba(0,0,0,0.5); border:1px solid var(--purple); color:var(--purple); margin-bottom:20px; font-size:1.2rem; text-align:center; border-radius:8px;" placeholder="***">
        <div style="display:flex; gap:12px;"><button class="ctrl-btn" style="flex:1;" onclick="document.getElementById('pwd-overlay').style.display='none'">返回</button><button class="ctrl-btn btn-purple" style="flex:1;" onclick="checkPwd()">确认</button></div>
    </div>
</div>

<div id="audio-overlay" class="overlay">
    <div style="text-align:center;">
        <div class="mono" style="color:#aaa; margin-bottom: 20px; font-size:0.8rem;">[ 建立通信链路 ]</div>
        <button class="ctrl-btn btn-gold" style="width:240px; height:60px; font-size:1.1rem; border-radius:30px;" onclick="unlockAudio()">开启环境感知</button>
    </div>
</div>

<button id="host-start-btn" onclick="hostGo()">[ 开启灵魂探寻 ]</button>
<div id="audio-bridge" style="display:none;"></div>

        "https://i.postimg.cc/p5Xc0mDx/jimeng-2026-04-3-889-bao-liu-ka-bian-ti-huan-ka-nei-rong-yi-zhang-fu-za-de-ta-luo-pai-cha-hua-8-bit-xiang-su-yi-shu-feng-ge-an-hei-sai-bo-peng-ke-bei.png",
        "https://i.postimg.cc/MfK3snyW/jimeng-2026-04-3-894-bao-liu-ka-bian-ti-huan-ka-nei-rong-yi-zhang-fu-za-de-ta-luo-pai-cha-hua-8-bit-xiang-su-yi-shu-feng-ge-an-hei-sai-bo-peng-ke-bei.png",
        "https://i.postimg.cc/t7XcRM8D/jimeng-2026-04-3-977-bao-liu-ka-bian-ti-huan-ka-nei-rong-yi-zhang-fu-za-de-ta-luo-pai-cha-hua-8-bit-xiang-su-yi-shu-feng-ge-an-hei-sai-bo-peng-ke-bei.png"
    ];

    const CUSTOM_QS = ["你上一次哭，是因为什么？", "你觉得这辈子最对不起的人是谁？", "童年里哪一件看似很小的事情，其实一直负面影响你到现在？", "此时此刻，你生活中最大的焦虑源头究竟是什么？", "如果生命只剩最后24小时，你会去见谁？", "谁曾经对你特别好，但后来你们却断了联系？", "你这辈子，最想收到谁的一句“对不起”？", "摘下所有的面具，你觉得自己到底有多累？", "你上一次对最亲近的人撒的谎是什么？", "哪一个瞬间，你突然觉得这份工作真的把你榨干了？", "谁的消息会让你看到就瞬间心跳加速、感到生理性不适？", "你人生中，哪一天是你打死都不想再经历第二次的？", "如果明天公司倒闭了，你第一反应是恐慌还是长舒一口气？", "给你一个机会工资减半但每天准时下班且没人找你，你会立刻答应吗？", "假如有个按钮能彻底清空你关于某一个人的所有记忆，你会按吗？", "如果用一年寿命换取一件极其渴望但没得到的东西，你会换什么？", "给你一千万条件是立刻和父母爱人彻底绝交，你换吗？", "如果你进入一个永远醒不来的美梦，你希望梦里的场景是什么样的？", "假设有一瓶吐真剂，你会给谁喝？问他什么问题？", "哪一句父母骂过你的话，你当时很不屑现在却发现自己变成了那样？", "如果明天的太阳不再升起，你今晚的最后一顿饭想吃什么？", "如果你有一件隐身衣你想利用它去做什么？", "分享一个你的童年阴影，可以是电影片段或生活打击。", "哪一首歌旋律一响，你的脑子里就会无条件弹出一个人？", "如果有人递给你一张任意目的地的单程机票，你想立刻飞去哪？", "哪一个毫无血缘关系的人，曾给你一种像亲人一样的感觉？", "如果寿命可以像微信转账一样转给别人，你会转给谁？", "如果有一个快进键跳过现在的苦难但代价是减寿三年，你会按吗？", "假设你能参加自己的葬礼，你觉得谁会在角落里哭得最伤心？", "如果给你一个“合法报复一次”的额度，你会立刻用在谁身上？", "假设你明天必须彻底离开，走之前你只想最后去见一个人，是谁？", "如果你死后手机数据会被公开，你最怕被谁看到里面的哪部分？", "如果可以用一句话总结你上一段失败的感情，你会说什么？", "你现在极度怀念却再也找不到的一种感觉是什么？"];
    
    // 底层跨国节点配置
    const peerConfig = { 
        config: { 
            'iceServers': [
                { urls: 'stun:stun.qq.com:3478' }, 
                { urls: 'stun:stun.chat.bilibili.com:3478' },
                { urls: 'stun:stun.miwifi.com:3478' },
                { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
            ] 
        } 
    };
    
    let peer, localStream = null, myNick, myRoom, isComp=false, players=[], conns=[], turnIdx=0, isLocked=false, handledIds=new Set();
    let cardIndex=null, compCardIndex=null, drawnCards=[], drawnCompCards=[], hostConn=null, hasInitialConnection=false, lastSyncTime=Date.now();
    let isEyeClosed = false;

    // --- 动效与仪式的底层函数 ---
    function playSfx(id) { const el = document.getElementById(id); if(el && el.src && el.src !== "") { el.currentTime = 0; el.play().catch(()=>{}); } }
    
    let typeTimer;
    function typeWriter(text) {
        const el = document.getElementById('guide-text');
        el.innerHTML = '';
        let i = 0;
        clearInterval(typeTimer);
        typeTimer = setInterval(() => {
            if (i < text.length) { el.innerHTML += text.charAt(i); i++; }
            else { el.innerHTML += '<span class="cursor">_</span>'; clearInterval(typeTimer); }
        }, 80);
    }

    function dismissIntro() {
        const intro = document.getElementById('intro-overlay'); intro.style.opacity = '0'; setTimeout(() => intro.style.display = 'none', 1500);
        const bgm = document.getElementById('bgm-audio'); if(bgm && bgm.src && bgm.src !== "") { bgm.volume = 0.3; bgm.play().catch(e=>{}); }
        playSfx('sfx-click');
    }

    function tryCompanion() { if(!document.getElementById('nick-in').value || !document.getElementById('room-in').value) return alert("先填昵称房号"); document.getElementById('comp-pwd-in').value = ''; document.getElementById('pwd-overlay').style.display = 'flex'; playSfx('sfx-click'); }
    function checkPwd() { if(document.getElementById('comp-pwd-in').value === '101010') { document.getElementById('pwd-overlay').style.display='none'; entry('companion'); } else { alert("密码错误"); } playSfx('sfx-click'); }
    
    function entry(m) { 
        myNick=document.getElementById('nick-in').value; myRoom=document.getElementById('room-in').value; if(!myNick||!myRoom) return alert("必填"); 
        isComp=(m==='companion'); localStorage.setItem('sn',myNick); localStorage.setItem('sr',myRoom); 
        document.getElementById('login-screen').style.display='none'; document.getElementById('main-game').style.display='flex'; 
        if(isComp){ document.getElementById('host-start-btn').style.display='block'; document.getElementById('btn-shuffle').style.display='flex'; document.getElementById('btn-eye').style.display='flex'; } 
        document.getElementById('audio-overlay').style.display='flex'; 
    }

    async function unlockAudio() { 
        if (!window.isSecureContext && location.protocol !== 'file:') alert("⚠️ 未开启 HTTPS，语音功能可能受限。");
        try { 
            localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); 
            if(localStream.getAudioTracks().length > 0) { 
                localStream.getAudioTracks()[0].enabled = true; 
                document.getElementById('mic-btn').classList.add('active');
            }
        } catch(e) { 
            alert(`⚠️ 麦克风受限\n将以纯文字模式进入。`);
            localStream = null; 
            document.getElementById('mic-btn').style.opacity = '0.3';
        } 
        document.getElementById('audio-overlay').style.display='none'; 
        initNetwork(); 
    }

    function broadcastState() { if (!isComp) return; sendAll({ type: 'SYNC', list: players, turnIdx: turnIdx, isLocked: isLocked, cardIndex: cardIndex, compCardIndex: compCardIndex, drawnCards: drawnCards, drawnCompCards: drawnCompCards, allIds: players.map(p=>p.peerId), isEyeClosed: isEyeClosed }); }

    function handleStream(peerId, stream) {
        if (!stream) return;
        try {
            let el = document.getElementById(`audio-${peerId}`); 
            if(!el) { el = document.createElement('audio'); el.id = `audio-${peerId}`; el.autoplay = true; el.playsInline = true; document.getElementById('audio-bridge').appendChild(el); } 
            el.srcObject = stream; el.play().catch(e=>{});
        } catch(e) { }
    }

    function initNetwork() {
        peer = new Peer(isComp ? `SPEAK-${myRoom}` : null, peerConfig);
        peer.on('error', (err) => { if (err.type === 'unavailable-id' && isComp) { alert("导师席已被占据"); location.reload(); } });
        peer.on('disconnected', () => peer.reconnect());
        peer.on('open', (id) => {
            document.getElementById('room-id-val').innerText = myRoom;
            if(isComp) { players=[{nick:myNick, isComp:true, peerId: id}]; renderUI(); setInterval(broadcastState, 2000); }
            else { hostConn = peer.connect(`SPEAK-${myRoom}`, {metadata: {nick: myNick}, reliable: true}); setupConn(hostConn); setInterval(() => { if (!hasInitialConnection || (Date.now() - lastSyncTime > 12000)) { hasInitialConnection = false; if(hostConn) hostConn.close(); hostConn = peer.connect(`SPEAK-${myRoom}`, {metadata: {nick: myNick}, reliable: true}); setupConn(hostConn); } }, 4000); }
        });
        peer.on('connection', (c) => { conns.push(c); setupConn(c); c.on('close', () => { if(isComp) { players = players.filter(p => p.peerId !== c.peer); renderUI(); broadcastState(); } }); });
        peer.on('call', (call) => { try { handledIds.add(call.peer); call.answer(localStream || undefined); call.on('stream', (s) => handleStream(call.peer, s)); } catch(e) {} });
    }

    function setupConn(c) {
        c.on('open', () => { if(!isComp) { hasInitialConnection = true; lastSyncTime = Date.now(); c.send({type:'JOIN', nick:myNick, peerId: peer.id}); } });
        c.on('data', (d) => {
            if(d.type==='JOIN' && isComp) { if(!players.find(p=>p.peerId===d.peerId)) { players.push({nick:d.nick, isComp:false, peerId: d.peerId}); renderUI(); } broadcastState(); }
            if(d.type==='SYNC') { 
                hasInitialConnection = true; lastSyncTime = Date.now(); players=d.list; turnIdx=d.turnIdx; drawnCards = d.drawnCards || []; drawnCompCards = d.drawnCompCards || [];
                if(d.isLocked && !isLocked) triggerUnlock();
                isEyeClosed = d.isEyeClosed; updateEyeVisuals();
                if (d.compCardIndex !== compCardIndex) { if (d.compCardIndex !== null) { compCardIndex = d.compCardIndex; showSpectrum(compCardIndex); } else { compCardIndex = null; hideSpectrum(); } }
                if (d.cardIndex !== cardIndex) { if (d.cardIndex !== null) { cardIndex = d.cardIndex; showArchive(cardIndex, (players.filter(p=>!p.isComp)[turnIdx]||{}).nick); } else { cardIndex = null; hideArchive(); } }
                renderUI(); updateGuide(); if(isLocked) updateDeckVisibility();
                if(d.allIds && localStream) { d.allIds.forEach(id => { if(id !== peer.id && !handledIds.has(id)) { try { const call = peer.call(id, localStream); if(call) { handledIds.add(id); call.on('stream', (s) => handleStream(id, s)); } } catch(e) {} } }); }
            }
            if(d.type==='UNLOCK') triggerUnlock();
            if(d.type==='DRAW') { cardIndex = d.idx; if(!drawnCards.includes(d.idx)) drawnCards.push(d.idx); updateDeckVisibility(); showArchive(d.idx, d.nick); if(isComp) broadcastState(); }
            if(d.type==='CLOSE') { cardIndex = null; hideArchive(); if(isComp) { const users = players.filter(p=>!p.isComp); if(users.length > 0) turnIdx = (turnIdx + 1) % users.length; broadcastState(); } }
            if(d.type==='CHAT') { if (d.nick !== myNick) { appendChat(d.nick, d.msg); if(d.isAnim) { triggerAnim(d.msg); } } if(isComp) sendAll(d); }
            if(d.type==='DRAW_COMP') { compCardIndex = d.idx; if(!drawnCompCards.includes(d.idx)) drawnCompCards.push(d.idx); updateDeckVisibility(); showSpectrum(d.idx); if(isComp) broadcastState(); }
            if(d.type==='CLOSE_COMP') { compCardIndex = null; hideSpectrum(); if(isComp) broadcastState(); }
            if(d.type==='SHUFFLE_COMP') { compCardIndex = null; hideSpectrum(); drawnCompCards = []; updateDeckVisibility(); if(isComp) broadcastState(); }
        });
    }

    function triggerUnlock() { isLocked = true; document.getElementById('deck').style.display = 'flex'; renderDeck(); updateGuide(); }
    function sendAll(d) { if (isComp) { conns = conns.filter(c => c.open); conns.forEach(c => c.send(d)); } else { if (hostConn && hostConn.open) hostConn.send(d); } }
    function hostGo() { isLocked = true; triggerUnlock(); sendAll({type:'UNLOCK'}); document.getElementById('host-start-btn').style.display='none'; broadcastState(); playSfx('sfx-click'); }
    
    function hostCmd(t) {
        if(!isComp) return; playSfx('sfx-click');
        if(t==='CLOSE_COMP') { compCardIndex = null; hideSpectrum(); broadcastState(); }
        if(t==='SHUFFLE_COMP' && confirm("洗牌所有塔罗？")) { compCardIndex = null; hideSpectrum(); drawnCompCards = []; updateDeckVisibility(); sendAll({type:'SHUFFLE_COMP'}); broadcastState(); }
        if(t==='TOGGLE_EYE') { isEyeClosed = !isEyeClosed; updateEyeVisuals(); broadcastState(); }
    }

    function updateEyeVisuals() { const boards = [document.getElementById('focus-board'), document.getElementById('comp-card-board')]; const btn = document.getElementById('btn-eye'); boards.forEach(b => { if(b) b.classList.toggle('podium-hidden', isEyeClosed); }); if(btn) btn.innerText = isEyeClosed ? "👁️ 显牌" : "👁️ 藏牌"; }
    function updateGuide() { 
        if(!isLocked) return; 
        const users = players.filter(p=>!p.isComp); const targetNick = users[turnIdx] ? users[turnIdx].nick : '---'; 
        const txt = cardIndex !== null ? `[ ${targetNick} ] 正在倾诉...` : `等待 [ ${targetNick} ] 开启档案`;
        typeWriter(txt);
    }
    
    function renderUI() { 
        const pA = document.getElementById('player-area'); const cA = document.getElementById('companion-area'); pA.innerHTML = ""; cA.innerHTML = ""; 
        const targetNick = (players.filter(p=>!p.isComp)[turnIdx]||{}).nick; 
        players.forEach(p => { 
            const isTurn = (!p.isComp && p.nick === targetNick); 
            const h = `<div class="p-item online ${isTurn?'active-turn':''}"> <div class="p-avatar ${p.isComp?'is-companion':''}">${p.isComp?'✧':'👤'}</div> <div style="font-size:0.6rem;margin-top:6px;color:#aaa;width:55px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;">${p.nick}</div> </div>`; 
            if(p.isComp) cA.innerHTML = h; else pA.innerHTML += h; 
        }); 
    }
    
    function renderDeck() { 
        if(document.getElementById('deck').innerHTML !== "") return; let h=""; 
        if(isComp) { 
            h += `<div style="flex:0 0 auto; display:flex; align-items:center; padding: 0 5px;"><span style="writing-mode: vertical-lr; color:var(--purple); font-weight:600; font-size:0.75rem; letter-spacing:2px;">[ 指引 ]</span></div>`; 
            for(let i=0; i<20; i++) h+=`<div id="ccard-${i}" onclick="handleCompDraw(${i})" style="flex:0 0 90px; height:130px; background:var(--bg-mid); border:1px solid var(--purple); border-radius:10px; background-image:linear-gradient(135deg, rgba(122,78,191,0.2) 25%, transparent 25%, transparent 50%, rgba(122,78,191,0.2) 50%, rgba(122,78,191,0.2) 75%, transparent 75%, transparent); background-size:20px 20px; cursor:pointer; position:relative;"><div style="position:absolute; top:8px; left:8px; font-size:0.7rem; color:var(--purple);">✦</div></div>`; 
            h += `<div style="flex:0 0 1px; background:var(--glass-border); margin: 10px 5px;"></div>`; 
            h += `<div style="flex:0 0 auto; display:flex; align-items:center; padding: 0 5px;"><span style="writing-mode: vertical-lr; color:var(--text-muted); font-weight:600; font-size:0.75rem; letter-spacing:2px;">[ 档案 ]</span></div>`; 
        } 
        for(let i=0; i<40; i++) h+=`<div id="card-${i}" onclick="handleDraw(${i})" style="flex:0 0 90px; height:130px; background:var(--bg-mid); border:1px solid rgba(255,255,255,0.1); border-radius:10px; background-image:linear-gradient(45deg, rgba(255,255,255,0.03) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.03) 50%, rgba(255,255,255,0.03) 75%, transparent 75%, transparent); background-size:15px 15px; cursor:pointer;"></div>`; 
        document.getElementById('deck').innerHTML = h; updateDeckVisibility(); 
    }
    
    function updateDeckVisibility() { for(let i=0; i<40; i++) { const c = document.getElementById(`card-${i}`); if(c) c.style.visibility = drawnCards.includes(i) ? 'hidden' : 'visible'; } if(isComp) for(let i=0; i<20; i++) { const cc = document.getElementById(`ccard-${i}`); if(cc) cc.style.visibility = drawnCompCards.includes(i) ? 'hidden' : 'visible'; } }
    
    function handleDraw(i) { const users = players.filter(p=>!p.isComp); if(isComp || (users[turnIdx]||{}).nick !== myNick || cardIndex !== null || drawnCards.includes(i)) return; playSfx('sfx-flip'); sendAll({type:'DRAW', idx:i, nick:myNick}); }
    function handleCompDraw(i) { if(!isComp || compCardIndex !== null || drawnCompCards.includes(i)) return; playSfx('sfx-flip'); compCardIndex = i; drawnCompCards.push(i); updateDeckVisibility(); showSpectrum(i); broadcastState(); }

    function showSpectrum(idx) { 
        playSfx('sfx-magic');
        const board = document.getElementById('comp-card-board'); const img = document.getElementById('spectrum-img'); const loader = document.getElementById('img-loader'); const btn = document.getElementById('btn-cc-close');
        loader.style.display = 'block'; img.style.display = 'none'; btn.style.display = 'none';
        img.src = COMP_CARD_URLS[idx % COMP_CARD_URLS.length];
        img.onload = () => { loader.style.display = 'none'; img.style.display = 'block'; if(isComp) btn.style.display = 'block'; };
        document.getElementById('card-podium').classList.add('show');
        board.style.display = 'flex'; setTimeout(() => board.classList.add('show'), 10); 
    }

    function hideSpectrum() { const board = document.getElementById('comp-card-board'); board.classList.remove('show'); setTimeout(() => { board.style.display = 'none'; if(cardIndex === null) document.getElementById('card-podium').classList.remove('show'); }, 500); }
    
    function showArchive(idx, nick) { 
        playSfx('sfx-magic');
        const qText = document.getElementById('q-text');
        qText.innerText = CUSTOM_QS[idx % CUSTOM_QS.length]; 
        
        // 触发墨迹显影
        qText.classList.remove('ink-reveal');
        void qText.offsetWidth; // trigger reflow
        qText.classList.add('ink-reveal');

        document.getElementById('card-podium').classList.add('show');
        const b = document.getElementById('focus-board'); b.style.display='flex'; setTimeout(()=>b.classList.add('show'), 10); 
        document.getElementById('btn-like').disabled = (myNick === nick); document.getElementById('btn-dis').disabled = (myNick === nick); document.getElementById('btn-trans').disabled = (myNick !== nick); 
        const btn = document.getElementById('btn-close'); btn.innerText = myNick === nick ? "完成回答" : "聆听中..."; btn.disabled = (myNick !== nick); 
    }

    function userCmd(t) { if(t==='CLOSE') { hideArchive(); sendAll({type:'CLOSE'}); playSfx('sfx-click'); } }
    function hideArchive() { const b = document.getElementById('focus-board'); b.classList.remove('show'); setTimeout(()=>{ b.style.display='none'; if(compCardIndex === null) document.getElementById('card-podium').classList.remove('show'); }, 600); }
    
    // 🌟 星火升腾动效
    function actionReact(e) { triggerAnim(e); appendChat(myNick, e); sendAll({type:'CHAT', nick:myNick, msg:e, isAnim:true}); playSfx('sfx-click'); }
    function triggerAnim(e) { 
        for(let i=0; i<8; i++) { 
            const p=document.createElement('div'); p.className='spark'; 
            p.style.width = Math.random()*6+4+'px'; p.style.height = p.style.width;
            p.style.left = (20 + Math.random()*60)+'%'; p.style.top = '75%'; 
            p.style.setProperty('--dx',(Math.random()*100-50)+'px'); p.style.setProperty('--dy',(Math.random()*-300-100)+'px'); 
            document.body.appendChild(p); setTimeout(()=>p.remove(), 1500); 
        } 
    }

    function sendTextChat() { const input = document.getElementById('chat-input'); const msg = input.value.trim(); if(!msg) return; appendChat(myNick, msg); sendAll({type:'CHAT', nick:myNick, msg:msg}); input.value = ''; playSfx('sfx-click'); }
    function appendChat(n, m) { const b=document.getElementById('chat-flow'); b.innerHTML+=`<div style="margin-bottom:8px;"><span style="color:var(--gold); font-weight:600;">${n}:</span> <span style="opacity:0.9;">${m}</span></div>`; b.scrollTop=b.scrollHeight; }
    
    function toggleMic() { 
        if(!localStream) return alert("⚠️ 麦克风未就绪"); 
        playSfx('sfx-click');
        const track = localStream.getAudioTracks()[0];
        if(track) { 
            track.enabled = !track.enabled; 
            document.getElementById('mic-btn').classList.toggle('active', track.enabled); 
        }
    }
</script>
