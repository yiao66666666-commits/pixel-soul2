<html lang="zh-CN">

        @keyframes plasma { 0% { background-position: 0% 0%; } 100% { background-position: 200% 200%; } }

        #intro-overlay { position: fixed; inset: 0; z-index: 300000; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; transition: opacity 1s; }
        .intro-text { color: #ccc; font-size: 1.1rem; line-height: 2.2; margin-bottom: 40px; text-shadow: 0 0 10px rgba(255,255,255,0.2); animation: fadeIn 2s ease-in-out; }
        .intro-highlight { color: var(--gold); font-weight: bold; font-size: 1.2rem; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        #login-screen { position: fixed; inset: 0; z-index: 100000; background: rgba(5,5,5,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pixel-input { width: 260px; padding: 15px; background: rgba(0,0,0,0.8); border: 3px solid #333; color: var(--gold); text-align: center; font-size: 1.1rem; margin-bottom: 15px; box-shadow: 4px 4px 0 #000; }

        #main-game { display: none; flex-direction: column; height: 100vh; width: 100vw; background: transparent; }
        #process-guide { height: 32px; background: rgba(255,255,255,0.1); color: var(--gold); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 900; border-bottom: 1px solid #222; }
        
        .header-bar { height: 90px; display: flex; justify-content: space-between; padding: 5px 10px; background: rgba(0,0,0,0.8); border-bottom: 2px solid #222; }
        #player-area { display: flex; gap: 10px; overflow-x: auto; flex: 1; align-items: center; }
        #companion-area { width: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-left: 2px solid #333; }
        
        .p-item { display: flex; flex-direction: column; align-items: center; min-width: 55px; opacity: 0.5; transition: 0.3s; }
        .p-item.online { opacity: 1; }
        .p-avatar { width: 38px; height: 38px; border: 3px solid #333; background: #111; display: flex; align-items: center; justify-content: center; font-size: 1rem; border-radius: 8px; }
        .is-companion { border-color: var(--purple) !important; }
        .p-item.active-turn { border-color: var(--blue); background: rgba(0, 242, 255, 0.1); box-shadow: 0 0 10px var(--blue); }

        .stage { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; z-index: 10; }
        #card-podium { position: absolute; inset: 0; background: rgba(0,0,0,0.75); display: none; z-index: 4000; }
        
        #focus-board { 
            position: absolute; top: 45%; left: 50%; width: 82vw; height: 50vh; max-width: 340px; max-height: 400px;
            background: #fff; color: #111; border: 6px solid #000; border-radius: 18px;
            padding: 20px; display: none; flex-direction: column; align-items: center; justify-content: space-between;
            z-index: 5001; transform: translate(-50%, -30%); opacity: 0; transition: 0.5s;
        }
        #focus-board.show { display: flex; transform: translate(-50%, -50%); opacity: 1; }

        #comp-card-board {
            position: absolute; top: 45%; left: 50%; width: 85vw; max-width: 380px; 
            background: #000; border: 4px solid var(--purple); border-radius: 16px;
            padding: 10px; display: none; flex-direction: column; align-items: center;
            z-index: 6001; transform: translate(-50%, -50%) scale(0.8); opacity: 0; transition: 0.4s;
        }
        #comp-card-board.show { display: flex; transform: translate(-50%, -50%) scale(1); opacity: 1; }
        #spectrum-img { width: 100%; height: auto; max-height: 42vh; object-fit: contain; border-radius: 8px; display: none; } 
        
        .podium-hidden { opacity: 0.05 !important; pointer-events: none !important; }
        .particle { position: fixed; pointer-events: none; animation: fly 0.8s forwards; z-index: 300000; font-size: 2.5rem; }
        @keyframes fly { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(2.5); opacity: 0; } }

        .ctrl-btn { height: 40px; border: 3px solid var(--blue); background: #000; color: var(--blue); font-weight: 900; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .ctrl-btn:active { transform: scale(0.95); }
        .footer { height: 230px; background: #000; border-top: 2px solid var(--blue); display: flex; flex-direction: column; z-index: 100; }
        #chat-flow { flex: 1; overflow-y: auto; padding: 10px; font-size: 0.8rem; color: var(--blue); }
        .btn-panel { height: 80px; display: flex; padding: 5px 10px; gap: 8px; align-items: center; justify-content: center; }
        .mic-btn { border-radius: 50%; width: 55px; height: 55px; font-size: 1.4rem; color: #fff; border: 4px solid var(--blue); background: #000; }
        .mic-btn.active { background: var(--pink); border-color: #fff; box-shadow: 0 0 15px var(--pink); }

        #img-loader { width: 30px; height: 30px; border: 3px solid var(--purple); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }

</head>

        </div>
    </div>
</div>

</div>

                { urls: 'stun:global.stun.twilio.com:3478' },
                { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
                { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
            ] 
        } 
    };
    
    let peer, localStream = null, myNick, myRoom, isComp=false, players=[], conns=[], turnIdx=0, isLocked=false, handledIds=new Set();
    let cardIndex=null, compCardIndex=null, drawnCards=[], drawnCompCards=[], hostConn=null, hasInitialConnection=false, lastSyncTime=Date.now();
    let isEyeClosed = false;

    function playSfx(id) { const el = document.getElementById(id); if(el) { el.currentTime = 0; el.play().catch(()=>{}); } }
    
    function dismissIntro() {
        const intro = document.getElementById('intro-overlay'); intro.style.opacity = '0'; setTimeout(() => intro.style.display = 'none', 1000);
        const bgm = document.getElementById('bgm-audio'); if(bgm) { bgm.volume = 0.3; bgm.play().catch(e=>console.log("BGM block")); }
        playSfx('sfx-click');
    }

    function tryCompanion() { if(!document.getElementById('nick-in').value || !document.getElementById('room-in').value) return alert("先填昵称房号"); document.getElementById('comp-pwd-in').value = ''; document.getElementById('pwd-overlay').style.display = 'flex'; playSfx('sfx-click'); }
    function checkPwd() { if(document.getElementById('comp-pwd-in').value === '101010') { document.getElementById('pwd-overlay').style.display='none'; entry('companion'); } else { alert("密码错误"); } playSfx('sfx-click'); }
    
    function entry(m) { 
        myNick=document.getElementById('nick-in').value; myRoom=document.getElementById('room-in').value; if(!myNick||!myRoom) return alert("必填"); 
        isComp=(m==='companion'); localStorage.setItem('sn',myNick); localStorage.setItem('sr',myRoom); 
        document.getElementById('login-screen').style.display='none'; document.getElementById('main-game').style.display='flex'; 
        if(isComp){ document.getElementById('host-start-btn').style.display='block'; document.getElementById('btn-shuffle').style.display='block'; document.getElementById('btn-eye').style.display='block'; } 
        document.getElementById('audio-overlay').style.display='flex'; playSfx('sfx-click');
    }

    // 【核心修复2：容错捕获，防止无麦克风权限导致全盘崩溃】
    async function unlockAudio() { 
        try { 
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); 
            if(localStream.getAudioTracks().length > 0) { localStream.getAudioTracks()[0].enabled = false; }
        } catch(e) { 
            console.log("Mic error or denied. Running in text-only mode."); 
            localStream = null; 
        } 
        document.getElementById('audio-overlay').style.display='none'; 
        initNetwork(); playSfx('sfx-click');
    }

    function broadcastState() { if (!isComp) return; sendAll({ type: 'SYNC', list: players, turnIdx: turnIdx, isLocked: isLocked, cardIndex: cardIndex, compCardIndex: compCardIndex, drawnCards: drawnCards, drawnCompCards: drawnCompCards, allIds: players.map(p=>p.peerId), isEyeClosed: isEyeClosed }); }

    function handleStream(peerId, stream) {
        try {
            let el = document.getElementById(`audio-${peerId}`); 
            if(!el) { el = document.createElement('audio'); el.id = `audio-${peerId}`; el.autoplay = true; el.playsInline = true; document.getElementById('audio-bridge').appendChild(el); } 
            el.srcObject = stream; el.play().catch(e=>{});
        } catch(e) { console.warn("Stream handling error", e); }
    }

    function initNetwork() {
        peer = new Peer(isComp ? `SPEAK-${myRoom}` : null, peerConfig);
        peer.on('error', (err) => { if (err.type === 'unavailable-id' && isComp) { alert("房间已有陪伴师！"); location.reload(); } });
        peer.on('disconnected', () => peer.reconnect());
        peer.on('open', (id) => {
            document.getElementById('room-id-val').innerText = myRoom;
            if(isComp) { players=[{nick:myNick, isComp:true, peerId: id}]; renderUI(); setInterval(broadcastState, 2000); }
            else { hostConn = peer.connect(`SPEAK-${myRoom}`, {metadata: {nick: myNick}, reliable: true}); setupConn(hostConn); setInterval(() => { if (!hasInitialConnection || (Date.now() - lastSyncTime > 12000)) { hasInitialConnection = false; if(hostConn) hostConn.close(); hostConn = peer.connect(`SPEAK-${myRoom}`, {metadata: {nick: myNick}, reliable: true}); setupConn(hostConn); } }, 4000); }
        });
        peer.on('connection', (c) => { conns.push(c); setupConn(c); c.on('close', () => { if(isComp) { players = players.filter(p => p.peerId !== c.peer); renderUI(); broadcastState(); } }); });
        
        peer.on('call', (call) => { 
            try {
                handledIds.add(call.peer); 
                call.answer(localStream || undefined); 
                call.on('stream', (s) => handleStream(call.peer, s)); 
            } catch(e) { console.warn("Incoming call error", e); }
        });
    }

    function setupConn(c) {
        c.on('open', () => { if(!isComp) { hasInitialConnection = true; lastSyncTime = Date.now(); c.send({type:'JOIN', nick:myNick, peerId: peer.id}); } });
        c.on('data', (d) => {
            if(d.type==='JOIN' && isComp) { if(!players.find(p=>p.peerId===d.peerId)) { players.push({nick:d.nick, isComp:false, peerId: d.peerId}); renderUI(); } broadcastState(); }
            if(d.type==='SYNC') { 
                hasInitialConnection = true; lastSyncTime = Date.now(); players=d.list; turnIdx=d.turnIdx; drawnCards = d.drawnCards || []; drawnCompCards = d.drawnCompCards || [];
                if(d.isLocked && !isLocked) triggerUnlock();
                isEyeClosed = d.isEyeClosed; updateEyeVisuals();
                if (d.compCardIndex !== compCardIndex) { if (d.compCardIndex !== null) { compCardIndex = d.compCardIndex; showSpectrum(compCardIndex); } else { compCardIndex = null; hideSpectrum(); } }
                if (d.cardIndex !== cardIndex) { if (d.cardIndex !== null) { cardIndex = d.cardIndex; showArchive(cardIndex, (players.filter(p=>!p.isComp)[turnIdx]||{}).nick); } else { cardIndex = null; hideArchive(); } }
                renderUI(); updateGuide(); if(isLocked) updateDeckVisibility();
                
                // 【核心修复3：安全拨号】只有本地有麦克风流，才去主动呼叫对方
                if(d.allIds) { 
                    d.allIds.forEach(id => { 
                        if(id !== peer.id && !handledIds.has(id)) { 
                            try {
                                if (localStream) {
                                    const call = peer.call(id, localStream); 
                                    if(call) { handledIds.add(id); call.on('stream', (s) => handleStream(id, s)); } 
                                }
                            } catch(e) { console.warn("Outgoing call error", e); }
                        } 
                    }); 
                }
            }
            if(d.type==='UNLOCK') triggerUnlock();
            if(d.type==='DRAW') { cardIndex = d.idx; if(!drawnCards.includes(d.idx)) drawnCards.push(d.idx); updateDeckVisibility(); showArchive(d.idx, d.nick); if(isComp) broadcastState(); }
            if(d.type==='CLOSE') { cardIndex = null; hideArchive(); if(isComp) { const users = players.filter(p=>!p.isComp); if(users.length > 0) turnIdx = (turnIdx + 1) % users.length; broadcastState(); } }
            if(d.type==='CHAT') { if (d.nick !== myNick) { appendChat(d.nick, d.msg); if(d.isAnim) { triggerAnim(d.msg); playSfx('sfx-click'); } } if(isComp) sendAll(d); }
            if(d.type==='DRAW_COMP') { compCardIndex = d.idx; if(!drawnCompCards.includes(d.idx)) drawnCompCards.push(d.idx); updateDeckVisibility(); showSpectrum(d.idx); if(isComp) broadcastState(); }
            if(d.type==='CLOSE_COMP') { compCardIndex = null; hideSpectrum(); if(isComp) broadcastState(); }
            if(d.type==='SHUFFLE_COMP') { compCardIndex = null; hideSpectrum(); drawnCompCards = []; updateDeckVisibility(); if(isComp) broadcastState(); }
        });
    }

    function triggerUnlock() { isLocked = true; document.getElementById('deck').style.display = 'flex'; renderDeck(); updateGuide(); }
    function sendAll(d) { if (isComp) { conns = conns.filter(c => c.open); conns.forEach(c => c.send(d)); } else { if (hostConn && hostConn.open) hostConn.send(d); } }
    function hostGo() { isLocked = true; triggerUnlock(); sendAll({type:'UNLOCK'}); document.getElementById('host-start-btn').style.display='none'; broadcastState(); playSfx('sfx-click'); }
    
    function hostCmd(t) {
        if(!isComp) return;
        playSfx('sfx-click');
        if(t==='CLOSE_COMP') { compCardIndex = null; hideSpectrum(); broadcastState(); }
        if(t==='SHUFFLE_COMP' && confirm("洗牌所有塔罗？")) { compCardIndex = null; hideSpectrum(); drawnCompCards = []; updateDeckVisibility(); sendAll({type:'SHUFFLE_COMP'}); broadcastState(); }
        if(t==='TOGGLE_EYE') { isEyeClosed = !isEyeClosed; updateEyeVisuals(); broadcastState(); }
    }

    function updateEyeVisuals() { const boards = [document.getElementById('focus-board'), document.getElementById('comp-card-board')]; const btn = document.getElementById('btn-eye'); boards.forEach(b => { if(b) b.classList.toggle('podium-hidden', isEyeClosed); }); if(btn) btn.innerText = isEyeClosed ? "👁️ 显牌" : "👁️ 藏牌"; }
    function updateGuide() { const g = document.getElementById('process-guide'); if(!isLocked) return; const users = players.filter(p=>!p.isComp); const targetNick = users[turnIdx] ? users[turnIdx].nick : '---'; g.innerText = cardIndex !== null ? `[ ${targetNick} ] 正在坦白...` : `轮到 [ ${targetNick} ] 开启档案...`; }
    function renderUI() { const pA = document.getElementById('player-area'); const cA = document.getElementById('companion-area'); pA.innerHTML = ""; cA.innerHTML = ""; const targetNick = (players.filter(p=>!p.isComp)[turnIdx]||{}).nick; players.forEach(p => { const isTurn = (!p.isComp && p.nick === targetNick); const h = `<div class="p-item online ${isTurn?'active-turn':''}"> <div class="p-avatar ${p.isComp?'is-companion':''}">🃏</div> <div style="font-size:0.5rem;margin-top:4px;color:#aaa;width:55px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;">${p.nick}</div> </div>`; if(p.isComp) cA.innerHTML = h; else pA.innerHTML += h; }); }
    
    function renderDeck() { 
        if(document.getElementById('deck').innerHTML !== "") return; 
        let h=""; 
        if(isComp) { 
            h += `<div style="flex:0 0 auto; display:flex; align-items:center; padding: 0 5px;"><span style="writing-mode: vertical-lr; color:var(--purple); font-weight:900; font-size:0.75rem;">🔮塔罗区</span></div>`; 
            for(let i=0; i<20; i++) h+=`<div id="ccard-${i}" onclick="handleCompDraw(${i})" style="flex:0 0 90px; height:130px; background:#4b0082; border:2px solid #555; border-radius:8px; background-image:repeating-linear-gradient(45deg, #4b0082, #4b0082 8px, #0044ff 8px, #0044ff 16px); cursor:pointer; position:relative;"><div style="position:absolute; top:5px; left:5px; font-size:0.6rem; background:#000; border-radius:50%;">🔮</div></div>`; 
            h += `<div style="flex:0 0 3px; background:#333; margin: 10px 5px;"></div>`; 
            h += `<div style="flex:0 0 auto; display:flex; align-items:center; padding: 0 5px;"><span style="writing-mode: vertical-lr; color:#666; font-weight:900; font-size:0.75rem;">📁档案区</span></div>`; 
        } 
        for(let i=0; i<40; i++) h+=`<div id="card-${i}" onclick="handleDraw(${i})" style="flex:0 0 90px; height:130px; background:#2a104a; border:2px solid #555; border-radius:8px; background-image:repeating-linear-gradient(45deg, #3d1563, #3d1563 8px, #2a104a 8px, #2a104a 16px); cursor:pointer;"></div>`; 
        document.getElementById('deck').innerHTML = h; updateDeckVisibility(); 
    }
    
    function updateDeckVisibility() { for(let i=0; i<40; i++) { const c = document.getElementById(`card-${i}`); if(c) c.style.visibility = drawnCards.includes(i) ? 'hidden' : 'visible'; } if(isComp) for(let i=0; i<20; i++) { const cc = document.getElementById(`ccard-${i}`); if(cc) cc.style.visibility = drawnCompCards.includes(i) ? 'hidden' : 'visible'; } }
    
    function handleDraw(i) { const users = players.filter(p=>!p.isComp); if(isComp || (users[turnIdx]||{}).nick !== myNick || cardIndex !== null || drawnCards.includes(i)) return; playSfx('sfx-flip'); sendAll({type:'DRAW', idx:i, nick:myNick}); }
    function handleCompDraw(i) { if(!isComp || compCardIndex !== null || drawnCompCards.includes(i)) return; playSfx('sfx-flip'); compCardIndex = i; drawnCompCards.push(i); updateDeckVisibility(); showSpectrum(i); broadcastState(); }

    function showSpectrum(idx) { 
        playSfx('sfx-magic');
        const board = document.getElementById('comp-card-board'); const img = document.getElementById('spectrum-img'); const loader = document.getElementById('img-loader'); const btn = document.getElementById('btn-cc-close');
        loader.style.display = 'block'; img.style.display = 'none'; btn.style.display = 'none';
        img.src = COMP_CARD_URLS[idx % COMP_CARD_URLS.length];
        img.onload = () => { loader.style.display = 'none'; img.style.display = 'block'; if(isComp) btn.style.display = 'block'; };
        board.style.display = 'flex'; setTimeout(() => board.classList.add('show'), 50); document.getElementById('card-podium').style.display='block'; 
    }

    function hideSpectrum() { const board = document.getElementById('comp-card-board'); board.classList.remove('show'); setTimeout(() => { board.style.display = 'none'; if(cardIndex === null) document.getElementById('card-podium').style.display='none'; }, 500); }
    
    function showArchive(idx, nick) { 
        playSfx('sfx-magic');
        document.getElementById('q-text').innerText = CUSTOM_QS[idx % CUSTOM_QS.length]; 
        document.getElementById('card-podium').style.display='block'; const b = document.getElementById('focus-board'); b.style.display='flex'; setTimeout(()=>b.classList.add('show'), 50); 
        document.getElementById('btn-like').disabled = (myNick === nick); document.getElementById('btn-dis').disabled = (myNick === nick); document.getElementById('btn-trans').disabled = (myNick !== nick); 
        const btn = document.getElementById('btn-close'); btn.innerText = myNick === nick ? "完成回答" : "等待发言..."; btn.disabled = (myNick !== nick); 
    }

    function userCmd(t) { if(t==='CLOSE') { hideArchive(); sendAll({type:'CLOSE'}); playSfx('sfx-click'); } }
    function hideArchive() { const b = document.getElementById('focus-board'); b.classList.remove('show'); setTimeout(()=>{ b.style.display='none'; if(compCardIndex === null) document.getElementById('card-podium').style.display='none'; }, 500); }
    
    function actionReact(e) { triggerAnim(e); appendChat(myNick, e); sendAll({type:'CHAT', nick:myNick, msg:e, isAnim:true}); playSfx('sfx-click'); }
    function triggerAnim(e) { for(let i=0; i<10; i++) { const p=document.createElement('div'); p.className='particle'; p.innerText=e; p.style.left='50%'; p.style.top='45%'; p.style.setProperty('--dx',(Math.random()*600-300)+'px'); p.style.setProperty('--dy',(Math.random()*-600-100)+'px'); document.body.appendChild(p); setTimeout(()=>p.remove(), 800); } }

    function sendTextChat() { const input = document.getElementById('chat-input'); const msg = input.value.trim(); if(!msg) return; appendChat(myNick, msg); sendAll({type:'CHAT', nick:myNick, msg:msg}); input.value = ''; playSfx('sfx-click'); }
    function appendChat(n, m) { const b=document.getElementById('chat-flow'); b.innerHTML+=`<div><span style="color:var(--gold)">${n}:</span> ${m}</div>`; b.scrollTop=b.scrollHeight; }
    
    function toggleMic() { 
        if(!localStream) return alert("麦克风未授权或未找到设备"); 
        playSfx('sfx-click');
        const track = localStream.getAudioTracks()[0];
        if(track) { track.enabled = !track.enabled; document.getElementById('mic-btn').classList.toggle('active', track.enabled); }
    }
</script>
</body>
</html>
